apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-dummy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-dummy
  template:
    metadata:
      labels:
        app: mcp-dummy
      annotations:
        # Restart the pod when the server source changes
        checksum/source: "v3"
    spec:
      containers:
      - name: mcp-dummy
        image: python:3.12-slim
        # The mcp SDK is installed at startup, so no custom image build is needed.
        # This is the only step that requires network access; the tools themselves
        # are pure local computation. The version is pinned because server.py is
        # written against the 2.x API, which is not compatible with 1.x.
        command: ["/bin/sh", "-c"]
        args:
        - pip install --no-cache-dir --root-user-action=ignore 'mcp==2.0.0' && exec python /app/server.py
        ports:
        - containerPort: 8000
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          tcpSocket:
            port: 8000
          # Allow time for the pip install before the first probe
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        volumeMounts:
        - name: mcp-source
          mountPath: /app
          readOnly: true
      volumes:
      - name: mcp-source
        configMap:
          name: mcp-dummy-source
