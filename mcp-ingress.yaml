apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-dummy-ingress
  annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # MCP streamable HTTP can answer with an SSE stream, which response
      # buffering would hold back. Ignored by non-nginx controllers.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  tls:
  - hosts:
    - dummy-mcp.cluster.dphx.eu
    secretName: dummy-mcp-tls
  rules:
  - host: dummy-mcp.cluster.dphx.eu
    http:
      paths:
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: mcp-dummy-service
            port:
              number: 8000
