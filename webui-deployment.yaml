apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "500Mi"
        env:
        - name: OLLAMA_BASE_URL
          value: "http://ollama-service.applications.svc.cluster.local:11434"
        # Ollama Cloud (gemma4) via its OpenAI-compatible endpoint
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: OPENAI_API_BASE_URLS
          value: "https://ollama.com/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: ollama-cloud
              key: api-key
        # OIDC single sign-on via Authentik (local login form stays enabled)
        - name: WEBUI_URL
          value: "https://open-webui.cluster.dphx.eu"
        - name: OAUTH_PROVIDER_NAME
          value: "Authentik"
        - name: OPENID_PROVIDER_URL
          value: "https://authentik.cluster.dphx.eu/application/o/openwebui/.well-known/openid-configuration"
        - name: OPENID_REDIRECT_URI
          value: "https://open-webui.cluster.dphx.eu/oauth/oidc/login/callback"
        - name: OPENID_END_SESSION_ENDPOINT
          value: "https://authentik.cluster.dphx.eu/application/o/openwebui/end-session/"
        - name: OAUTH_SCOPES
          value: "openid email profile"
        - name: OAUTH_CLIENT_ID
          value: "TStdOhhqSfMEtsg04pKA81rmPacin5Cj5nCIPiVU"
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: openwebui-oidc
              key: client-secret
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        tty: true
        volumeMounts:
        - name: webui-volume
          mountPath: /app/backend/data
      volumes:
      - name: webui-volume
        persistentVolumeClaim:
          claimName: open-webui-pvc          
