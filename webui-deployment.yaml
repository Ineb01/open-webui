apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "500Mi"
        env:
        - name: OLLAMA_BASE_URL
          value: "http://ollama-service.applications.svc.cluster.local:11434"
        # Ollama Cloud (gemma4) via its OpenAI-compatible endpoint
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: OPENAI_API_BASE_URLS
          value: "https://ollama.com/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: ollama-cloud
              key: api-key
        tty: true
        volumeMounts:
        - name: webui-volume
          mountPath: /app/backend/data
      volumes:
      - name: webui-volume
        persistentVolumeClaim:
          claimName: open-webui-pvc          
