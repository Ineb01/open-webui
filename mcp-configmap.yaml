apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-dummy-source
data:
  server.py: |
    """A minimal MCP server with offline-only tools, used to verify tool calling.

    Written against the mcp 2.x SDK, where the server class is MCPServer
    (called FastMCP in 1.x) and the transport options moved into run().
    """

    import os
    import socket
    from datetime import datetime, timezone

    from mcp.server import MCPServer

    server = MCPServer("dummy-tools")


    @server.tool()
    def add(a: float, b: float) -> float:
        """Add two numbers and return the sum."""
        return a + b


    @server.tool()
    def reverse_text(text: str) -> str:
        """Reverse the characters of the given text."""
        return text[::-1]


    @server.tool()
    def word_count(text: str) -> dict:
        """Count the characters, words and lines in the given text."""
        return {
            "characters": len(text),
            "words": len(text.split()),
            "lines": len(text.splitlines()) or (1 if text else 0),
        }


    @server.tool()
    def server_info() -> dict:
        """Report the pod this MCP server runs in and its current UTC time."""
        return {
            "hostname": socket.gethostname(),
            "namespace": os.getenv("POD_NAMESPACE", "unknown"),
            "utc_time": datetime.now(timezone.utc).isoformat(),
        }


    if __name__ == "__main__":
        server.run(
            transport="streamable-http",
            host="0.0.0.0",
            port=8000,
            streamable_http_path="/mcp",
            stateless_http=True,
        )
