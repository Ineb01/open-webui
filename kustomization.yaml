apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: applications

resources:
  # Ollama LLM Backend
  - ollama-statefulset.yaml
  - ollama-service.yaml
  
  # MCP Proxy Server
  - mcpo-proxy-deployment.yaml
  - mcpo-proxy-service.yaml
  
  # Open WebUI
  - webui-pvc.yaml
  - webui-deployment.yaml
  - webui-service.yaml
  - webui-ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: open-webui-stack
